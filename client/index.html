<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebRTC Calling App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h2>WebRTC Calling App</h2>
      <p id="room-id-display">Room: Loading...</p>
      <p id="status-text">Connecting to signaling server...</p>
    </header>

    <!-- Lobby controls (Initial state) -->
    <div id="lobby-controls" class="controls">
      <button id="start-voice-btn" onclick="startCall('voice')">Start Voice Call</button>
      <button id="start-video-btn" onclick="startCall('video')">Start Video Call</button>
    </div>

    <!-- Active Video Grid (WhatsApp Overlay Style) -->
    <div id="video-container" class="video-grid hidden">
      <div class="remote-video-wrapper">
        <video id="remoteVideo" autoplay playsinline></video>
        <span class="video-label">Remote Peer</span>
      </div>
      <div class="local-video-wrapper">
        <video id="localVideo" autoplay playsinline muted></video>
        <span class="video-label">You</span>
      </div>
    </div>

    <!-- In-Call / Calling Controls (Always visible when calling or in a call) -->
    <div id="incall-controls" class="controls hidden">
      <button id="mute-btn" onclick="toggleMute()">Mute Audio</button>
      <button id="camera-btn" onclick="toggleCamera()">Toggle Camera</button>
      <button id="end-btn" class="danger" onclick="endCall(true)">End Call</button>
    </div>

    <!-- Incoming Call Modal -->
    <div id="incoming-modal" class="modal hidden">
      <div class="modal-content">
        <h3 id="incoming-type-text">Incoming Call</h3>
        <p id="caller-name">Someone is calling...</p>
        <div class="modal-buttons">
          <button class="success" onclick="acceptCall()">Accept</button>
          <button class="danger" onclick="rejectCall()">Reject</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
