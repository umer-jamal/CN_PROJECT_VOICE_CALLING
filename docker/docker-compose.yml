version: '3.8'

services:
  signaling-server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: webrtc_signaling_server
    environment:
      - NODE_ENV=production
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    container_name: webrtc_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../client:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../server/certs:/etc/nginx/certs:ro
    depends_on:
      - signaling-server

  coturn:
    image: coturn/coturn:latest
    container_name: webrtc_coturn
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49152-49200:49152-49200/udp"
    environment:
      - DETECT_EXTERNAL_IP=yes
    command:
      - turnserver
      - -n
      - --log-file=stdout
      - --min-port=49152
      - --max-port=49200
      - --realm=localhost
      - --user=webrtcuser:webrtcpass